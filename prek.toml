default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-toml", stages = ["pre-commit"] },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt --all",
    language = "system",
    entry = "cargo fmt --all",
    pass_filenames = false,
    files = "\\.rs$|^rustfmt\\.toml$",
    stages = ["pre-commit"],
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy --workspace -- -D warnings",
    language = "system",
    entry = "cargo clippy --workspace -- -D warnings",
    pass_filenames = false,
    files = "\\.rs$|^Cargo\\.toml$|^Cargo\\.lock$",
    stages = ["pre-commit"],
  },
  {
    id = "cargo-test",
    name = "cargo test --workspace",
    language = "system",
    entry = "cargo test --workspace",
    pass_filenames = false,
    stages = ["pre-push"],
  },
]
