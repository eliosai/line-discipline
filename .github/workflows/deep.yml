name: deep
# Everything too slow for every pull request, which a release pull request runs before its version ships

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Miri interprets the real tests and rules out undefined behaviour on the paths they reach
  miri:
    runs-on: ubuntu-24.04
    # rust-toolchain.toml pins stable, which outranks the default the setup action sets
    env:
      RUSTUP_TOOLCHAIN: nightly
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: miri, rust-src
          tools: cargo-nextest
      - run: cargo miri setup
      - run: MIRIFLAGS="-Zmiri-tree-borrows" cargo miri nextest run --workspace

  # The standard library's own debug assertions, which only fire under a release build in production
  careful:
    runs-on: ubuntu-24.04
    # rust-toolchain.toml pins stable, which outranks the default the setup action sets
    env:
      RUSTUP_TOOLCHAIN: nightly
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rust-src
          tools: cargo-careful
      - run: cargo careful test --workspace --all-features

  # A lockfile hides a wrong lower bound, and importers resolve against their own trees
  minimal-versions:
    runs-on: ubuntu-24.04
    # rust-toolchain.toml pins stable, which outranks the default the setup action sets
    env:
      RUSTUP_TOOLCHAIN: nightly
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          tools: just,cargo-hack,cargo-minimal-versions
      - run: just minimal

  # A dead link in the docs a release ships
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the README links this repository by URL for crates.io, and the checkout answers those links
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --remap '^https://github\.com/eliosai/line-discipline/blob/main/ file://${{ github.workspace }}/'
            README.md 'docs/**/*.md'
          fail: true
