name: bench

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: codspeed-macro
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed
      - name: build the benches
        run: cargo codspeed build -m simulation
      - name: run the benches on CodSpeed
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run -m simulation
  bench-walltime:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: codspeed-macro
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed
      - name: build the benches
        run: cargo codspeed build -m walltime
      - name: run the benches on CodSpeed
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: cargo codspeed run -m walltime
